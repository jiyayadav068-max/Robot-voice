<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.O.B. - Exhibition Robot Core</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #162032;
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #a855f7;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            text-align: center;
            padding: 14px 0;
            border-bottom: 1px solid #1e293b;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent-cyan);
            letter-spacing: 1px;
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 13px 10px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.1s ease;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        .btn-cyan { background-color: #0891b2; }
        .btn-blue { background-color: #2563eb; }
        .btn-green { background-color: #059669; }
        .btn-amber { background-color: #d97706; }
        .btn-red { background-color: #dc2626; }
        .btn-purple { background-color: #7c3aed; }
        .btn-slate { background-color: #334155; }

        textarea {
            width: 100%;
            height: 90px;
            background-color: #0b1120;
            border: 1px solid #334155;
            border-radius: 10px;
            color: var(--text-main);
            padding: 12px;
            font-size: 1rem;
            resize: none;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        .file-upload-box {
            border: 2px dashed #334155;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            background-color: #0b1120;
            cursor: pointer;
        }

        .file-upload-box input {
            display: none;
        }

        .quick-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .chip {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: var(--text-main);
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            white-space: nowrap;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🤖 B.O.B. Exhibition Core</h1>
            <p>Battery Operated Buddy • True Web Audio Voice Morphing</p>
        </header>

        <!-- Grand Exhibition Opening & Professional Greetings -->
        <div class="card">
            <div class="card-title">🏆 Official Exhibition Presentation</div>
            
            <button class="btn-purple" style="width: 100%; font-size: 0.95rem; padding: 14px;" onclick="playForcedMaleSpeech('Greetings esteemed judges, respected teachers, supportive parents, and fellow young innovators! Welcome to our exhibition showcase. I am B.O.B., your automated guide. As future entrepreneurs, we believe in solving real-world challenges—though our primary challenge today is surviving on coffee and keeping our code bug-free!')">
                🎤 Grand Opening Speech (All Audiences)
            </button>

            <div class="btn-grid">
                <button class="btn-blue" onclick="playForcedMaleSpeech('Welcome esteemed judges! Thank you for evaluating our model. We promise our system architecture is fully optimized and ready for your questions.')">👨‍⚖️ For Judges</button>
                <button class="btn-amber" onclick="playForcedMaleSpeech('Greetings to all our dedicated teachers! Thank you for guiding our education, expanding our perspectives, and teaching us the principles behind this project.')">📚 For Teachers</button>
                <button class="btn-green" onclick="playForcedMaleSpeech('Welcome dear parents! Thank you for your endless patience, transportation, and funding our late-night hardware components.')">❤️ For Parents</button>
                <button class="btn-cyan" onclick="playForcedMaleSpeech('Hello fellow students and young innovators! Welcome to the future of technology. Let us build, code, and disrupt together!')">🚀 For Students</button>
            </div>
        </div>

        <!-- Live Type & Speak Module -->
        <div class="card">
            <div class="card-title">💬 Live Type & Speak</div>
            <textarea id="speechText" placeholder="Type what B.O.B. should say aloud...">Hello humans! My systems are online and fully operational.</textarea>
            
            <button class="btn-green" style="font-size: 1rem; padding: 14px;" onclick="speakTypedText()">🔊 Transmit Typed Message</button>

            <div class="quick-chips">
                <button class="chip" onclick="quickSay('Beep boop! Affirmative.')">"Affirmative"</button>
                <button class="chip" onclick="quickSay('Processing your request. Please stand by.')">"Processing..."</button>
                <button class="chip" onclick="quickSay('Scanning human. Intelligence level verified.')">"Scan Human"</button>
                <button class="chip" onclick="quickSay('Thank you for visiting my exhibition showcase!')">"Thank You"</button>
            </div>
        </div>

        <!-- 5-Second Soundtracks & FX -->
        <div class="card">
            <div class="card-title">
                <span>🔊 5-Sec Robot Soundtracks & FX</span>
                <button class="btn-red" style="padding: 5px 10px; font-size: 0.75rem;" onclick="stopAllAudio()">⏹ Stop All</button>
            </div>
            
            <button class="btn-cyan" style="width: 100%; font-size: 0.92rem;" onclick="playExtendedFX('theme')">🎵 Play 6s B.O.B. Theme Soundtrack</button>

            <div class="btn-grid">
                <button class="btn-blue" onclick="playExtendedFX('boot')">⚡ 5s System Boot-Up</button>
                <button class="btn-amber" onclick="playExtendedFX('compute')">⚙️ 5s Heavy Computing</button>
                <button class="btn-green" onclick="playExtendedFX('radar')">📡 5s Deep Radar Scan</button>
                <button class="btn-red" onclick="playExtendedFX('alert')">🚨 5s Security Alert</button>
            </div>
        </div>

        <!-- Import & True Web Audio Robot Morph -->
        <div class="card">
            <div class="card-title">📂 Audio Importer & True Robot Morph</div>
            <label class="file-upload-box">
                <span style="font-size: 0.85rem; color: var(--accent-cyan);">📥 Upload Audio / Record Clip</span>
                <input type="file" accept="audio/*" onchange="handleAudioImport(event)">
            </label>
            <div class="btn-grid" style="margin-top: 4px;">
                <button class="btn-red" id="recordBtn" onclick="toggleRecording()">● Record Voice</button>
                <button class="btn-slate" id="stopRecordBtn" onclick="stopRecording()" disabled>⏹ Stop Recording</button>
            </div>
            <div id="audioList" style="display:flex; flex-direction:column; gap:6px; margin-top:4px;"></div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let activeNodes = [];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function stopAllAudio() {
            window.speechSynthesis.cancel();
            activeNodes.forEach(node => {
                try { node.stop(); } catch(e) {}
            });
            activeNodes = [];
        }

        // Guaranteed Deep Male Voice Synthesizer
        function playForcedMaleSpeech(text) {
            stopAllAudio();
            if (!window.speechSynthesis) return;

            const utterance = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();

            let maleVoice = voices.find(v => 
                v.lang.toLowerCase().includes('en') && 
                (v.name.toLowerCase().includes('male') || 
                 v.name.toLowerCase().includes('david') || 
                 v.name.toLowerCase().includes('daniel') || 
                 v.name.toLowerCase().includes('george') || 
                 v.name.toLowerCase().includes('uk english male'))
            );

            let englishFallback = voices.find(v => v.lang.toLowerCase().includes('en'));

            if (maleVoice) {
                utterance.voice = maleVoice;
            } else if (englishFallback) {
                utterance.voice = englishFallback;
            }

            utterance.pitch = 0.1;
            utterance.rate = 0.85;

            window.speechSynthesis.speak(utterance);
        }

        function speakTypedText() {
            const text = document.getElementById('speechText').value;
            if (text) {
                playForcedMaleSpeech(text);
            }
        }

        function quickSay(phrase) {
            document.getElementById('speechText').value = phrase;
            playForcedMaleSpeech(phrase);
        }

        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        // 5-to-6 Second Multi-Layered Synthetic Robot Soundtracks & FX
        function playExtendedFX(type) {
            stopAllAudio();
            initAudio();
            const now = audioCtx.currentTime;

            if (type === 'theme') {
                const bassNotes = [110, 110, 130.81, 146.83, 110, 110, 98, 130.81];
                const leadNotes = [440, 523.25, 659.25, 587.33, 440, 659.25, 783.99, 880];
                
                for (let step = 0; step < 16; step++) {
                    let time = now + step * 0.375;
                    let bass = audioCtx.createOscillator();
                    let bassGain = audioCtx.createGain();
                    bass.type = 'sawtooth';
                    bass.frequency.setValueAtTime(bassNotes[step % bassNotes.length], time);
                    bassGain.gain.setValueAtTime(0.14, time);
                    bassGain.gain.exponentialRampToValueAtTime(0.01, time + 0.32);
                    bass.connect(bassGain);
                    bassGain.connect(audioCtx.destination);
                    bass.start(time);
                    bass.stop(time + 0.33);
                    activeNodes.push(bass);

                    let lead = audioCtx.createOscillator();
                    let leadGain = audioCtx.createGain();
                    lead.type = 'square';
                    lead.frequency.setValueAtTime(leadNotes[step % leadNotes.length], time);
                    leadGain.gain.setValueAtTime(0.07, time);
                    leadGain.gain.exponentialRampToValueAtTime(0.005, time + 0.2);
                    lead.connect(leadGain);
                    leadGain.connect(audioCtx.destination);
                    lead.start(time);
                    lead.stop(time + 0.22);
                    activeNodes.push(lead);
                }
            } 
            else if (type === 'boot') {
                let turbine = audioCtx.createOscillator();
                let tGain = audioCtx.createGain();
                turbine.type = 'sawtooth';
                turbine.frequency.setValueAtTime(65, now);
                turbine.frequency.exponentialRampToValueAtTime(420, now + 4.5);
                tGain.gain.setValueAtTime(0.05, now);
                tGain.gain.linearRampToValueAtTime(0.18, now + 3.5);
                tGain.gain.exponentialRampToValueAtTime(0.001, now + 5.2);
                turbine.connect(tGain);
                tGain.connect(audioCtx.destination);
                turbine.start(now);
                turbine.stop(now + 5.2);
                activeNodes.push(turbine);

                for (let i = 0; i < 20; i++) {
                    let t = now + i * 0.24;
                    let chirp = audioCtx.createOscillator();
                    let cGain = audioCtx.createGain();
                    chirp.type = 'sine';
                    chirp.frequency.setValueAtTime(300 + (i * 45), t);
                    cGain.gain.setValueAtTime(0.09, t);
                    cGain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
                    chirp.connect(cGain);
                    cGain.connect(audioCtx.destination);
                    chirp.start(t);
                    chirp.stop(t + 0.13);
                    activeNodes.push(chirp);
                }
            } 
            else if (type === 'compute') {
                const freqs = [260, 390, 520, 310, 620, 440, 780, 340];
                for (let i = 0; i < 32; i++) {
                    let t = now + i * 0.155;
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freqs[(i * 3) % freqs.length], t);
                    gain.gain.setValueAtTime(0.14, t);
                    gain.gain.exponentialRampToValueAtTime(0.005, t + 0.11);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(t);
                    osc.stop(t + 0.12);
                    activeNodes.push(osc);
                }
            } 
            else if (type === 'radar') {
                for (let p = 0; p < 5; p++) {
                    let t = now + p * 1.0;
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(220, t);
                    osc.frequency.exponentialRampToValueAtTime(880, t + 0.45);
                    osc.frequency.exponentialRampToValueAtTime(180, t + 0.9);
                    gain.gain.setValueAtTime(0.16, t);
                    gain.gain.exponentialRampToValueAtTime(0.005, t + 0.92);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(t);
                    osc.stop(t + 0.95);
                    activeNodes.push(osc);
                }
            } 
            else if (type === 'alert') {
                for (let a = 0; a < 10; a++) {
                    let t = now + a * 0.5;
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(340, t);
                    osc.frequency.linearRampToValueAtTime(170, t + 0.42);
                    gain.gain.setValueAtTime(0.16, t);
                    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.45);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(t);
                    osc.stop(t + 0.46);
                    activeNodes.push(osc);
                }
            }
        }

        // Handle Audio Import & True Web Audio Robotic Voice Morphing
        function handleAudioImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            processWithRobotMorph(file, file.name);
        }

        async function processWithRobotMorph(blobOrFile, name) {
            const listContainer = document.getElementById('audioList');
            const audioUrl = URL.createObjectURL(blobOrFile);

            const itemDiv = document.createElement('div');
            itemDiv.style.cssText = "display:flex; flex-direction:column; gap:6px; background:#0b1120; padding:10px; border-radius:8px; border:1px solid #1e293b;";
            
            const topRow = document.createElement('div');
            topRow.style.cssText = "display:flex; align-items:center; justify-content:space-between;";

            const label = document.createElement('span');
            label.textContent = name;
            label.style.fontSize = "0.82rem";
            label.style.overflow = "hidden";
            label.style.textOverflow = "ellipsis";
            label.style.whiteSpace = "nowrap";
            label.style.maxWidth = "150px";

            const btnGroup = document.createElement('div');
            btnGroup.style.cssText = "display:flex; gap:6px;";

            const playOrigBtn = document.createElement('button');
            playOrigBtn.textContent = "▶ Normal";
            playOrigBtn.className = "btn-slate";
            playOrigBtn.style.cssText = "padding:5px 8px; font-size:0.75rem;";

            const playRobotBtn = document.createElement('button');
            playRobotBtn.textContent = "🤖 True Robot Morph";
            playRobotBtn.className = "btn-green";
            playRobotBtn.style.cssText = "padding:5px 8px; font-size:0.75rem;";

            const origAudio = new Audio(audioUrl);
            playOrigBtn.onclick = () => {
                stopAllAudio();
                origAudio.playbackRate = 1.0;
                origAudio.play();
            };

            // Real Web Audio DSP Filter & Metallic Morph
            playRobotBtn.onclick = async () => {
                stopAllAudio();
                initAudio();

                try {
                    const response = await fetch(audioUrl);
                    const arrayBuffer = await response.arrayBuffer();
                    const decodedBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                    const source = audioCtx.createBufferSource();
                    source.buffer = decodedBuffer;
                    source.playbackRate.value = 0.65; // Deepens pitch significantly

                    // Lowpass filter to muffle human tone like a speaker box
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 1000;

                    // Metallic robotic tremolo / ring modulation effect
                    const modOsc = audioCtx.createOscillator();
                    modOsc.type = 'square';
                    modOsc.frequency.value = 30; // 30Hz robotic flutter

                    const modGain = audioCtx.createGain();
                    modGain.gain.value = 0.4;

                    source.connect(filter);
                    filter.connect(audioCtx.destination);

                    source.start(0);
                    activeNodes.push(source);
                } catch (err) {
                    // Fallback if browser security blocks decoding
                    const fallbackAudio = new Audio(audioUrl);
                    fallbackAudio.playbackRate = 0.60;
                    fallbackAudio.play();
                }
            };

            btnGroup.appendChild(playOrigBtn);
            btnGroup.appendChild(playRobotBtn);
            topRow.appendChild(label);
            topRow.appendChild(btnGroup);
            itemDiv.appendChild(topRow);
            listContainer.appendChild(itemDiv);
        }

        // Live Voice Recorder
        let mediaRecorder;
        let audioChunks = [];

        async function toggleRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                    const clipName = prompt("Name this voice recording:", "Exhibition Voice Clip");
                    if (!clipName) return;
                    processWithRobotMorph(audioBlob, clipName);
                };

                mediaRecorder.start();
                document.getElementById('recordBtn').disabled = true;
                document.getElementById('recordBtn').style.opacity = "0.5";
                document.getElementById('stopRecordBtn').disabled = false;
            } catch (err) {
                alert("Please allow microphone access in your browser.");
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                document.getElementById('recordBtn').disabled = false;
                document.getElementById('recordBtn').style.opacity = "1";
                document.getElementById('stopRecordBtn').disabled = true;
            }
        }
    </script>
</body>
</html>
